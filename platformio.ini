; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino


build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Monitor settings
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    time

; Upload settings
upload_speed = 921600

; Library dependencies
lib_deps = 
    Wire
    ; BLE libraries are built into ESP32 Arduino core
    
; Optional: Uncomment if you need specific ESP32 BLE library
; lib_deps = 
;     ESP32 BLE Arduino

lib_ignore =
    SdFat - Adafruit Fork
    Adafruit Bluefruit
    
; Partition scheme for larger apps (optional, use if you run out of space)
; board_build.partitions = huge_app.csv

; Enable PSRAM (for ESP32 WROVER)
board_build.arduino.memory_type = qio_qspi
